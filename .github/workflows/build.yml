name: Build, test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and media tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxft-dev libfontconfig1 libarchive-dev ffmpeg fonts-noto-cjk

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Run unit tests
        run: ctest --preset linux-release

      - name: Run FFmpeg conversion, ZIP and PPTX tests
        run: ./build/linux-release/ffmpeg-ui --self-test

      - name: Package Linux application
        run: |
          mkdir -p dist/linux
          cp build/linux-release/ffmpeg-ui dist/linux/
          cp README.md dist/linux/
          cp -r docs dist/linux/
          tar -czf ffmpeg-studio-linux-x86_64.tar.gz -C dist/linux .

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-linux-x86_64
          path: ffmpeg-studio-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows build and media tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libarchive
        shell: pwsh
        run: vcpkg install --triplet x64-windows-static

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset windows-release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Run unit tests
        run: ctest --preset windows-release

      - name: Run FFmpeg conversion, ZIP and PPTX tests
        run: .\build\windows-release\ffmpeg-ui.exe --self-test

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item build\windows-release\ffmpeg-ui.exe dist\windows\
          Copy-Item README.md dist\windows\
          Copy-Item docs dist\windows\ -Recurse
          Compress-Archive -Path dist\windows\* -DestinationPath ffmpeg-studio-windows-x86_64.zip -Force

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-studio-windows-x86_64
          path: ffmpeg-studio-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-studio-linux-x86_64
          path: dist

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: ffmpeg-studio-windows-x86_64
          path: dist

      - name: Publish release and attach packages
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ffmpeg-studio-linux-x86_64.tar.gz
            dist/ffmpeg-studio-windows-x86_64.zip
