name: Build, test and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and media tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libx11-dev libxft-dev libfontconfig1 libarchive-dev ffmpeg fonts-noto-cjk openssh-server xvfb xdotool imagemagick

      - name: Start disposable SSH test server
        shell: bash
        run: |
          test_user=ffmpeg-studio-ci
          test_password=ffmpeg-studio-ci-test-password
          sudo useradd --user-group --create-home --shell /bin/bash "$test_user"
          echo "$test_user:$test_password" | sudo chpasswd
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/ffmpeg-studio-ci"
          sudo install -d -o "$test_user" -g "$test_user" -m 700 "/home/$test_user/.ssh"
          sudo install -o "$test_user" -g "$test_user" -m 600 \
            "$RUNNER_TEMP/ffmpeg-studio-ci.pub" "/home/$test_user/.ssh/authorized_keys"
          sudo ssh-keygen -A
          sudo mkdir -p /run/sshd
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          cat > "$RUNNER_TEMP/sshd_config" <<EOF
          Port 2222
          ListenAddress 127.0.0.1
          HostKey /etc/ssh/ssh_host_ed25519_key
          PidFile $RUNNER_TEMP/ffmpeg-studio-sshd.pid
          AuthorizedKeysFile .ssh/authorized_keys
          PasswordAuthentication yes
          KbdInteractiveAuthentication no
          PubkeyAuthentication yes
          PermitRootLogin no
          UsePAM yes
          StrictModes yes
          AllowUsers $test_user
          Subsystem sftp /usr/lib/openssh/sftp-server
          EOF
          sudo /usr/sbin/sshd -f "$RUNNER_TEMP/sshd_config" -E "$RUNNER_TEMP/sshd.log"
          for attempt in $(seq 1 20); do
            if ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1; then
            cat "$RUNNER_TEMP/sshd.log"
            exit 1
          fi
          {
            echo "FFMPEG_STUDIO_SSH_TEST_REAL=1"
            echo "FFMPEG_STUDIO_SSH_TEST_USER=$test_user"
            echo "FFMPEG_STUDIO_SSH_TEST_PORT=2222"
            echo "FFMPEG_STUDIO_SSH_TEST_KEY=$RUNNER_TEMP/ffmpeg-studio-ci"
            echo "FFMPEG_STUDIO_SSH_TEST_PASSWORD=$test_password"
          } >> "$GITHUB_ENV"

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --parallel

      - name: Run unit tests
        run: ctest --preset linux-release

      - name: Run FFmpeg conversion, ZIP, PPTX and SSH integration tests
        run: ./build/linux-release/video-compression-workbench --self-test

      - name: Capture Linux desktop interface
        shell: bash
        run: |
          mkdir -p artifacts/ui
          xvfb-run -a -s "-screen 0 1600x1100x24" bash -c '
            ./build/linux-release/video-compression-workbench > /tmp/video-compression-workbench-ui.log 2>&1 &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            window=""
            for attempt in $(seq 1 30); do
              window=$(xdotool search --class "VideoCompressionWorkbench" 2>/dev/null | head -n 1 || true)
              if [ -n "$window" ]; then break; fi
              sleep 1
            done
            if [ -z "$window" ]; then
              echo "Cannot locate the video compression workbench X11 window" >&2
              ps -p "$app_pid" -o pid,stat,cmd || true
              xdotool search --name . 2>/dev/null || true
              cat /tmp/video-compression-workbench-ui.log
              exit 1
            fi
            sleep 2
            xdotool mousemove --window "$window" 650 572 click 1
            sleep 1
            xdotool mousemove --window "$window" 580 610 click 1
            sleep 1
            import -window "$window" artifacts/ui/video-compression-workbench-linux.png
          '

      - name: Upload Linux interface screenshot
        uses: actions/upload-artifact@v4
        with:
          name: video-compression-workbench-ui-linux
          path: artifacts/ui/video-compression-workbench-linux.png
          if-no-files-found: error

      - name: Package Linux application
        run: |
          mkdir -p dist/linux
          cp build/linux-release/video-compression-workbench dist/linux/
          cp README.md dist/linux/
          cp -r docs dist/linux/
          tar -czf video-compression-workbench-linux-x86_64.tar.gz -C dist/linux .

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v4
        with:
          name: video-compression-workbench-linux-x86_64
          path: video-compression-workbench-linux-x86_64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows build and media tests
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install libarchive
        shell: pwsh
        run: vcpkg install --triplet x64-windows-static

      - name: Install FFmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Configure
        shell: pwsh
        run: >-
          cmake --preset windows-release
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static

      - name: Build
        run: cmake --build --preset windows-release --parallel

      - name: Run unit tests
        run: ctest --preset windows-release

      - name: Run FFmpeg conversion, ZIP and PPTX tests
        run: .\build\windows-release\video-compression-workbench.exe --self-test

      - name: Package Windows application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\windows | Out-Null
          Copy-Item build\windows-release\video-compression-workbench.exe dist\windows\
          Copy-Item README.md dist\windows\
          Copy-Item docs dist\windows\ -Recurse
          Compress-Archive -Path dist\windows\* -DestinationPath video-compression-workbench-windows-x86_64.zip -Force

      - name: Upload Windows release asset
        uses: actions/upload-artifact@v4
        with:
          name: video-compression-workbench-windows-x86_64
          path: video-compression-workbench-windows-x86_64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: video-compression-workbench-linux-x86_64
          path: dist

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: video-compression-workbench-windows-x86_64
          path: dist

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^project\(VideoCompressionWorkbench VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Could not read the project version from CMakeLists.txt' >&2
            exit 1
          fi
          tag="v${version}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$tag" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match project version $tag" >&2
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; increment the CMake project version for the next release."
            exit 0
          fi
          gh release create "$tag" \
            dist/video-compression-workbench-linux-x86_64.tar.gz \
            dist/video-compression-workbench-windows-x86_64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "视频压缩工作台 $tag" \
            --generate-notes
